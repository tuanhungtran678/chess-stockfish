<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cờ vua vs Stockfish</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="board-panel">
        <h1>Cờ vua đấu với Stockfish</h1>
        <div id="status">Bạn đi trước với quân trắng.</div>
        <div id="board" class="board" aria-label="Bàn cờ"></div>
      </section>

      <aside class="control-panel">
        <h2>Tùy chỉnh</h2>
        <label for="level">Độ sâu (1-18)</label>
        <input id="level" type="range" min="1" max="18" value="12" />
        <span id="level-value">12</span>

        <button id="new-game">Ván mới</button>

        <h3>Lịch sử nước đi</h3>
        <ol id="move-list"></ol>
      </aside>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
